name: Sync Google Drive HTML to GitHub Pages

on:
  schedule:
    # Set to run hourly to prevent cron throttling and quota exhaustion
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download HTML file and update if changed
        run: |
          # 1. Download file to a temporary file
          curl -sL "https://drive.google.com/uc?export=download&id=1r9fgTCJ8XQlM1lsXRS9Z4dkPjVCOVsiO" -o temp_drive.html

          # 2. Check if download succeeded and is valid HTML
          if [ ! -s temp_drive.html ] || grep -q -i "Error 404" temp_drive.html; then
            echo "Download failed or returned invalid HTML from Google Drive."
            rm -f temp_drive.html
            exit 1
          fi

          # 3. Strip existing banner from index.html for content comparison
          if [ -f index.html ]; then
            sed '/<div style=.*עודכן לאחרונה/d' index.html > temp_current.html
          else
            touch temp_current.html
          fi

          # 4. Compare downloaded content with existing content
          if cmp -s temp_drive.html temp_current.html; then
            echo "No content changes detected in Google Drive file."
            rm -f temp_drive.html temp_current.html
            exit 0
          fi

          # 5. Content changed: generate timestamp and apply banner
          TIMESTAMP=$(TZ="Asia/Jerusalem" date +"%Y-%m-%d %H:%M")
          BANNER="<div style='background-color: #f4f4f5; color: #52525b; text-align: center; padding: 8px; font-family: sans-serif; font-size: 13px; border-bottom: 1px solid #e4e4e7;' dir='rtl'>עודכן לאחרונה: $TIMESTAMP</div>"

          mv temp_drive.html index.html
          if grep -q -i "<body>" index.html; then
            sed -i "s|<body>|<body>$BANNER|gI" index.html
          else
            echo "$BANNER$(cat index.html)" > index.html
          fi

          rm -f temp_current.html

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes staged for commit."
          else
            git commit -m "Auto-update index.html from Google Drive with Hebrew timestamp"
            git pull --rebase origin main
            git push
          fi
