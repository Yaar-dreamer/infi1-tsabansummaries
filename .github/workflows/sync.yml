name: Sync Google Drive HTML to GitHub Pages

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download HTML file and add timestamp
        run: |
          # 1. Download file from Google Drive
          curl -sL "https://drive.google.com/uc?export=download&id=1jxCqTNUQuDHti_7NxLGGgMzeAbgv7Ucl" -o index.html

          # 2. Generate timestamp in Israel Time (Asia/Jerusalem) without timezone label
          TIMESTAMP=$(TZ="Asia/Jerusalem" date +"%Y-%m-%d %H:%M")

          # 3. Define the HTML banner in Hebrew with RTL text direction
          BANNER="<div style='background-color: #f4f4f5; color: #52525b; text-align: center; padding: 8px; font-family: sans-serif; font-size: 13px; border-bottom: 1px solid #e4e4e7;' dir='rtl'>עודכן לאחרונה: $TIMESTAMP</div>"

          # 4. Inject banner right after <body> tag if it exists, otherwise prepend to top
          if grep -q -i "<body>" index.html; then
            sed -i "s|<body>|<body>$BANNER|gI" index.html
          else
            echo "$BANNER$(cat index.html)" > index.html
          fi

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes detected in Google Drive file."
          else
            git commit -m "Auto-update index.html from Google Drive with Hebrew timestamp"
            git pull --rebase origin main
            git push
          fi
